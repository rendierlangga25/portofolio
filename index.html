function login(){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md"><h2>Login Admin</h2><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><p id="er" style="color:#c0392b;font-size:13px;margin:4px 0;min-height:18px"></p><button class="btn" id="go">Masuk</button> <button class="btn o" id="cx">Batal</button></div>`;document.body.appendChild(o);
const go=async()=>{const {error}=await sb.auth.signInWithPassword({email:o.querySelector('#em').value.trim(),password:o.querySelector('#pw').value});if(error)o.querySelector('#er').textContent=/invalid/i.test(error.message)?'Email atau password salah':error.message;else location.reload()};
o.querySelector('#cx').onclick=()=>o.remove();o.querySelector('#go').onclick=go;o.addEventListener('keydown',e=>{if(e.key==='Enter')go()});o.querySelector('#em').focus()}
function accent(){const r=document.documentElement.style,c=S.accent;if(/^#[0-9a-f]{6}$/i.test(c||'')){const n=parseInt(c.slice(1),16),l=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255;r.setProperty('--ac',c);r.setProperty('--btx',l>.6?'#111':'#fff')}else{r.removeProperty('--ac');r.removeProperty('--btx')}}
function modal(h,big){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md${big?' big':''}">${h}</div>`;o.addEventListener('click',e=>{if(e.target===o||(e.target.dataset&&e.target.dataset.cl))o.remove()});document.body.appendChild(o);return o}
function settings(){let ch=0;const o=modal(`<h2>Pengaturan Situs</h2><label>Warna aksen</label><input id="s-c" type="color" value="${/^#[0-9a-f]{6}$/i.test(S.accent||'')?S.accent:'#1f4e79'}" style="height:42px;padding:3px"><label>Judul situs (tab browser)</label><input id="s-t" value="${esc(S.ttl)}" placeholder="Otomatis dari nama"><label>Deskripsi untuk mesin pencari</label><textarea id="s-d" rows="3">${esc(S.desc)}</textarea><label>Teks footer</label><input id="s-f" value="${esc(S.foot)}" placeholder="Otomatis: © tahun nama"><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button class="btn" id="s-ok">Terapkan</button><button class="btn o" data-cl="1">Batal</button><button class="btn o" id="s-rs">Reset warna</button></div>`);
o.querySelector('#s-c').oninput=()=>ch=1;
o.querySelector('#s-ok').onclick=()=>{if(ch)S.accent=o.querySelector('#s-c').value;S.ttl=o.querySelector('#s-t').value.trim();S.desc=o.querySelector('#s-d').value.trim();S.foot=o.querySelector('#s-f').value.trim();dirty=true;o.remove();render()};
o.querySelector('#s-rs').onclick=()=>{S.accent='';dirty=true;o.remove();render()}}
async function inbox(){const o=modal('<h2>Pesan Masuk</h2><div id="ml" class="mu">Memuat…</div><button class="btn o" data-cl="1" style="margin-top:14px">Tutup</button>',1);const L=o.querySelector('#ml');const {data,error}=await sb.from('contact_messages').select('*').order('created_at',{ascending:false}).limit(50);
if(error){L.textContent='Gagal memuat: '+error.message+' (sudah menjalankan update.sql di Supabase?)';return}
L.innerHTML=data.length?data.map(m=>`<div class="msg"><b>${esc(m.name)}</b> · <a href="mailto:${esc(m.email)}">${esc(m.email)}</a><div class="mu" style="font-size:12px">${new Date(m.created_at).toLocaleString('id-ID')}</div><div class="ml" style="margin:6px 0">${esc(m.message)}</div><button class="x2" data-dm="${m.id}">Hapus</button></div>`).join(''):'Belum ada pesan.';
L.onclick=async e=>{const id=e.target.dataset.dm;if(!id||!confirm('Hapus pesan ini?'))return;const {error}=await sb.from('contact_messages').delete().eq('id',id);if(!error)e.target.closest('.msg').remove()}}
async function sendMsg(){const g=i=>$('#'+i).value.trim(),n=g('fm-n'),m=g('fm-m'),em=g('fm-e'),st=$('#fm-s');if($('#fm-h').value)return;if(!n||!m||!/^\S+@\S+\.\S+$/.test(em)){st.textContent='Lengkapi nama, email yang valid, dan pesan.';return}st.textContent='Mengirim…';const {error}=await sb.from('contact_messages').insert({name:n,email:em,message:m});if(error){st.textContent='Gagal mengirim. Coba lagi nanti.';return}['fm-n','fm-e','fm-m'].forEach(i=>$('#'+i).value='');st.textContent='Terima kasih, pesan Anda sudah terkirim.'}
document.addEventListener('click',async e=>{
const t=e.target,d=t.dataset||{};
try{
if(t.closest&&t.closest('#th')){theme(document.documentElement.dataset.theme==='dark'?'light':'dark');render()}
else if(d.up){const k=d.up;pick(k==='photo'?800:1200,async b=>{msg='Mengunggah…';render();try{setP(k,await upl(b,'jpg','image/jpeg'));dirty=true;msg=''}catch(er){msg='Gagal upload: '+er.message}render()})}
else if(d.di){const [a,b]=d.di.split('.');if(confirm('Hapus item ini?')){S.sections[a].items.splice(b,1);dirty=true;render()}}
else if(d.ad){const s=S.sections[d.ad];s.items.push(MK[s.type]());dirty=true;render()}
else if(d.ds){if(confirm('Hapus seluruh bagian ini beserta isinya?')){S.sections.splice(d.ds,1);dirty=true;render()}}
else if(d.mv){const [i,k]=d.mv.split('.'),a=+i,b=a+ +k;if(b>=0&&b<S.sections.length){[S.sections[a],S.sections[b]]=[S.sections[b],S.sections[a]];dirty=true;render()}}
else if(d.z&&!edit){const o=document.createElement('div');o.className='lb';o.innerHTML=`<img src="${t.src}" alt="">`;o.onclick=()=>o.remove();document.body.appendChild(o)}
else if(d.hd){const [a,b]=d.hd.split('.');const o=b===undefined?S.sections[a]:S.sections[a].items[b];o.h=!o.h;dirty=true;render()}
else if(t.id==='set'){settings()}
else if(t.id==='msgs'){inbox()}
else if(t.id==='sendm'){await sendMsg()}
else if(t.id==='ed'){edit=true;msg='';render()}
else if(t.id==='ex'){if(!dirty||confirm('Batalkan semua perubahan yang belum disimpan?')){dirty=false;location.reload()}}
else if(t.id==='nsec'){const c=prompt('Jenis bagian:\n1 = Riwayat (pengalaman, pendidikan)\n2 = Kartu dengan foto (proyek, galeri)\n3 = Daftar (sertifikat, pelatihan, penghargaan)','3');const ty={1:'timeline',2:'cards',3:'list'}[(c||'').trim()];if(!ty)return;const n=prompt('Judul bagian:',{timeline:'Pengalaman',cards:'Proyek',list:'Sertifikat'}[ty]);if(!n)return;S.sections.push({id:'s'+Date.now(),type:ty,title:n,items:[MK[ty]()]});dirty=true;render()}
else if(t.id==='cvup'){const f=document.createElement('input');f.type='file';f.accept='application/pdf';f.onchange=async()=>{const x=f.files[0];if(!x)return;if(x.size>10e6){msg='PDF maksimal 10 MB';render();return}msg='Mengunggah CV…';render();try{S.cv=await upl(x,'pdf','application/pdf');dirty=true;msg='CV terunggah. Klik Simpan.'}catch(er){msg='Gagal: '+er.message}render()};f.click()}
else if(t.id==='sv'){msg='Menyimpan…';render();const {error}=await sb.from('portfolio').upsert({id:1,data:S});if(error)msg='Gagal: '+error.message;else{dirty=false;edit=false;msg='Tersimpan ✓';setTimeout(()=>{msg='';render()},3000)}render()}
else if(t.id==='lo'){await sb.auth.signOut();location.reload()}
else if(t.id==='lg'){e.preventDefault();login()}
else if(t.id==='pr'){e.preventDefault();print()}
}catch(er){msg='Terjadi kesalahan: '+(er.message||er);render()}});
(async()=>{try{if(sb){const {data:ss}=await sb.auth.getSession();can=!!ss.session;const {data}=await sb.from('portfolio').select('data').eq('id',1).maybeSingle();S=norm(data&&data.data)}}catch(e){}render()})();
</script></body></html>
