<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portofolio</title><meta name="description" content="Portofolio profesional">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf8;--card:#fff;--tx:#17191f;--mu:#5d6470;--ln:#e5e3dd;--ac:#1f4e79;--acs:#eaf0f6;--btx:#fff;color-scheme:light}
:root[data-theme=dark]{--bg:#101217;--card:#171a21;--tx:#eceef2;--mu:#9aa1ae;--ln:#272b35;--ac:#86b6e8;--acs:#1b2736;--btx:#0d1520;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
h1,h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}h3{font-size:16.5px;font-weight:600;margin:0;line-height:1.4}
a{color:var(--ac)}.w{max-width:1040px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
nav .w{display:flex;justify-content:space-between;align-items:center;height:60px;gap:16px}
nav b{font-family:"Source Serif 4",Georgia,serif;font-size:18px;white-space:nowrap}nav .nl{display:flex;gap:22px;align-items:center;overflow:hidden}
nav .nl a{color:var(--mu);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}nav .nl a:hover{color:var(--tx)}
#th{background:none;border:1px solid var(--ln);color:var(--tx);width:36px;height:36px;border-radius:8px;cursor:pointer;display:grid;place-items:center;flex:none}
#th svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:56px;align-items:center;padding:72px 0 52px}
.eb{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:500}
h1{font-size:clamp(36px,5.6vw,56px);line-height:1.1;margin:12px 0 10px}.role{font-size:19px;color:var(--ac);font-weight:500;margin:0 0 16px}
.lead{color:var(--mu);max-width:560px;margin:0}
.btn{display:inline-block;border:1px solid var(--ac);cursor:pointer;font:500 15px Inter,system-ui,sans-serif;padding:10px 20px;border-radius:6px;background:var(--ac);color:var(--btx);text-decoration:none}
.btn.o{background:transparent;color:var(--tx);border-color:var(--ln)}.btn.o:hover{border-color:var(--tx)}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.ph{aspect-ratio:4/5;border-radius:8px;background:var(--acs);color:var(--ac);border:1px solid var(--ln);overflow:hidden;position:relative;display:grid;place-items:center;font:600 80px "Source Serif 4",Georgia,serif}
.ph img,.pc .im img{width:100%;height:100%;object-fit:cover;display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:24px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:28px 0}
.n{font:600 34px "Source Serif 4",Georgia,serif;line-height:1.2}.l{color:var(--mu);font-size:14px}
section{padding-top:68px}.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--ln);padding-bottom:12px;margin-bottom:26px}
h2{font-size:26px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:56px}.two h2{margin-bottom:16px}.mu{color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--ln);background:var(--card);padding:5px 13px;border-radius:6px;font-size:14px;font-weight:500}
.tl{display:grid;grid-template-columns:170px 1fr;gap:24px;padding:18px 0;border-bottom:1px solid var(--ln)}.tl:last-child,.ls:last-child{border-bottom:0}
.tp{color:var(--mu);font-size:14px;padding-top:2px}.org{color:var(--ac);font-weight:500;font-size:14.5px}.tb p,.bd p{margin:6px 0 0;color:var(--mu);font-size:15px}
.ls{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--ln)}.yr{color:var(--mu);font-size:14px;white-space:nowrap}.ls a,.bd a{font-size:14px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.pc{background:var(--card);border:1px solid var(--ln);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.im{aspect-ratio:16/10;background:var(--acs);position:relative;display:grid;place-items:center;color:var(--mu);font-size:13px}.im img{cursor:zoom-in}
.bd{padding:18px 20px 20px;position:relative;display:flex;flex-direction:column;gap:4px;flex:1}.bd a{margin-top:auto;padding-top:8px}
.tg{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ac);font-weight:600}.tb,.ls>div:first-child{position:relative}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:56px}.cr{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--ln)}.cr span:first-child{width:96px;color:var(--mu);flex:none}
footer{margin-top:80px;border-top:1px solid var(--ln);padding:26px 0 100px;color:var(--mu);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}footer a{color:inherit}
.ml{white-space:pre-line}
.ed [contenteditable]{outline:1.5px dashed var(--ac);outline-offset:3px;border-radius:3px;min-height:1em}.ed [contenteditable]:empty::before{content:"(kosong)";opacity:.4}
.sc{display:flex;gap:6px;flex-wrap:wrap}.sc button,.x,.up{font:500 12.5px Inter,sans-serif;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:6px;padding:4px 10px;cursor:pointer}
.dg,.x{color:#c0392b!important}.x{position:absolute;top:0;right:0}.up{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;border:0}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--tx);color:var(--bg);padding:8px;border-radius:12px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:94vw;flex-wrap:wrap;justify-content:center}
.bar .btn{padding:8px 14px;font-size:14px;background:var(--bg);color:var(--tx);border-color:var(--bg)}.bar .btn.o{background:transparent;color:var(--bg);border-color:rgba(128,128,128,.5)}.bar span{font-size:13px;padding:0 8px}
.ov,.lb{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:grid;place-items:center}.lb{background:rgba(0,0,0,.88);cursor:zoom-out}.lb img{max-width:92vw;max-height:90vh;border-radius:6px}
.md{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:28px;width:min(360px,90vw)}.md h2{font-size:22px;margin-bottom:10px}
.md input{width:100%;padding:10px 12px;margin:6px 0;border-radius:6px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:15px Inter,sans-serif}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:28px;padding-top:36px}.ph{max-width:240px;order:-1}.tl{grid-template-columns:1fr;gap:2px}.two,.ct{grid-template-columns:1fr;gap:32px}.nl a{display:none}}
@media print{nav,.bar,.noprint,footer a{display:none!important}body{background:#fff;color:#000}section{break-inside:avoid}}
</style></head>

const DEF={name:'Nama Lengkap',title:'Posisi atau Bidang Keahlian',tagline:'Tuliskan satu atau dua kalimat tentang apa yang Anda kerjakan dan nilai yang Anda bawa untuk perusahaan.',about:'Ceritakan latar belakang pendidikan, pengalaman kerja, dan hal yang Anda cari pada langkah karier berikutnya. Tiga sampai empat kalimat sudah cukup agar mudah dibaca.',photo:'',email:'',link:'',wa:'',loc:'Jakarta, Indonesia',cv:'',

function norm(d){const o=structuredClone(DEF);if(!d)return o;
for(const k of['name','title','tagline','about','photo','email','link','wa','loc','cv'])if(typeof d[k]==='string')o[k]=d[k];
if(Array.isArray(d.skills))o.skills=d.skills;if(Array.isArray(d.stats))o.stats=d.stats;
if(Array.isArray(d.sections))o.sections=d.sections;
else if(Array.isArray(d.projects))o.sections=o.sections.map(s=>s.id==='proyek'?{...s,items:d.projects}:s);
return o}
let S=norm(),edit=false,can=false,msg='',dirty=false;
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const E=(p,v,tag='span',cls='',ml=0)=>`<${tag} class="${cls}${ml?' ml':''}" data-p="${p}"${edit?' contenteditable="true" spellcheck="false"':''}>${esc(v)}</${tag}>`;
const V=(p,v,tag,cls,ml)=>(v||edit)?E(p,v,tag,cls,ml):'';
function setP(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}

function sec(s,si){
const it=s.items.map((x,ii)=>{const b=`sections.${si}.items.${ii}.`,del=edit?`<button class="x" data-di="${si}.${ii}">Hapus</button>`:'';
const lk=(lbl)=>edit?`<div class="org">Link: ${E(b+'url',x.url||'')}</div>`:(x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${lbl}</a>`:'');
if(s.type==='timeline')return `<div class="tl"><div class="tp">${V(b+'p',x.p)}</div><div class="tb">${V(b+'t',x.t,'h3')}${V(b+'o',x.o,'div','org')}${V(b+'d',x.d,'p','',1)}${del}</div></div>`;
if(s.type==='list')return `<div class="ls"><div><h3>${E(b+'t',x.t)}</h3>${V(b+'o',x.o,'div','org')}${lk('Lihat kredensial')}${del}</div><div class="yr">${V(b+'p',x.p)}</div></div>`;
return `<article class="pc"><div class="im">${x.img?`<img src="${esc(x.img)}" alt="" data-z="1">`:'<span>Belum ada foto</span>'}${edit?`<button class="up" data-up="${b}img">Ganti foto</button>`:''}</div><div class="bd">${V(b+'tags',x.tags,'div','tg')}${V(b+'t',x.t,'h3')}${V(b+'d',x.d,'p','',1)}${lk('Lihat selengkapnya →')}${del}</div></article>`}).join('');
const ctl=edit?`<div class="sc"><button data-mv="${si}.-1">↑ Naik</button><button data-mv="${si}.1">↓ Turun</button><button data-ad="${si}">+ Item</button><button class="dg" data-ds="${si}">Hapus bagian</button></div>`:'';
return `<section id="s-${esc(s.id)}"><div class="sh">${E(`sections.${si}.title`,s.title,'h2')}${ctl}</div><div class="${s.type==='cards'?'grid':''}">${it}</div></section>`}
function render(){
document.title=S.name+(S.title?' — '+S.title:'');const md=$('meta[name=description]');if(md)md.content=(S.tagline||'').slice(0,150);
const ini=(S.name||'?').trim()[0]||'?',dk=document.documentElement.dataset.theme==='dark';
const stats=(edit?S.stats:S.stats.filter(s=>s.n||s.l)).map((s,i)=>`<div><div class="n">${V(`stats.${i}.n`,s.n)}</div><div class="l">${V(`stats.${i}.l`,s.l)}</div></div>`).join('');
const skills=edit?E('skills',S.skills.join(', '),'div','chips'):S.skills.map(s=>`<span class="chip">${esc(s)}</span>`).join('');
const rows=edit?[['Email',E('email',S.email)],['LinkedIn',E('link',S.link)],['WhatsApp',E('wa',S.wa)],['Lokasi',E('loc',S.loc)]]:[['Email',S.email&&`<a href="mailto:${esc(S.email)}">${esc(S.email)}</a>`],['LinkedIn',S.link&&`<a href="${esc(S.link)}" target="_blank" rel="noopener">${esc(S.link.replace(/^https?:\/\/(www\.)?/,''))}</a>`],['WhatsApp',S.wa&&`<a href="https://wa.me/${S.wa.replace(/\D/g,'')}" target="_blank" rel="noopener">${esc(S.wa)}</a>`],['Lokasi',S.loc&&esc(S.loc)]].filter(r=>r[1]);
$('#app').className=edit?'ed':'';
$('#app').innerHTML=`<nav><div class="w"><b>${esc(S.name)}</b><div class="nl"><a href="#tentang">Tentang</a>${S.sections.map(s=>`<a href="#s-${esc(s.id)}">${esc(s.title)}</a>`).join('')}<a href="#kontak">Kontak</a><button id="th" title="Ganti tema" aria-label="Ganti tema">${dk?ICON.dark:ICON.light}</button></div></div></nav>
<main class="w"><div class="hero"><div>${S.loc?`<div class="eb">${esc(S.loc)}</div>`:''}<h1>${E('name',S.name)}</h1><p class="role">${E('title',S.title)}</p><p class="lead ml">${E('tagline',S.tagline,'span','',1)}</p><div class="row"><a class="btn" href="#kontak">Hubungi Saya</a>${S.cv?`<a class="btn o" href="${esc(S.cv)}" target="_blank" rel="noopener">Unduh CV</a>`:''}</div></div>
<div class="ph">${S.photo?`<img src="${esc(S.photo)}" alt="Foto ${esc(S.name)}">`:esc(ini)}${edit?`<button class="up" data-up="photo">Ganti foto</button>`:''}</div></div>
<div class="stats">${stats}</div>
<section id="tentang"><div class="two"><div><h2>Tentang Saya</h2><p class="mu ml" style="margin:0">${E('about',S.about,'span','',1)}</p></div><div><h2>Keahlian</h2>${edit?'<p class="mu" style="margin:0 0 8px;font-size:13px">Pisahkan dengan koma</p>':''}<div class="chips">${skills}</div></div></div></section>
${S.sections.map(sec).join('')}

<div class="w"><footer><span>© ${new Date().getFullYear()} ${esc(S.name)}</span><span>${can?'':'<a href="#" id="pr" class="noprint">Cetak</a> · <a href="#" id="lg" class="noprint">Admin</a>'}</span></footer></div>
${can?`<div class="bar noprint">${edit?`<button class="btn" id="sv">Simpan &amp; Publish</button><button class="btn o" id="nsec">+ Bagian</button><button class="btn o" id="cvup">Upload CV</button><button class="btn o" id="ex">Batal</button>`:`<button class="btn" id="ed">Edit Portofolio</button><button class="btn o" id="lo">Keluar</button>`}${msg?`<span>${esc(msg)}</span>`:''}</div>`:''}`}
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.p;if(!p||!edit)return;const v=e.target.innerText.replace(/\n+$/,'');if(p==='skills')S.skills=v.split(',').map(s=>s.trim()).filter(Boolean);else setP(p,v);dirty=true});
document.addEventListener('paste',e=>{if(!e.target.isContentEditable)return;e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function pick(max,cb){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const file=f.files[0];if(!file)return;const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*r;c.height=im.height*r;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>cb(b),'image/jpeg',.85)};im.src=URL.createObjectURL(file)};f.click()}
async function upl(b,ext,type){const path=Date.now()+'.'+ext;const {error}=await sb.storage.from('portfolio').upload(path,b,{contentType:type});if(error)throw error;return sb.storage.from('portfolio').getPublicUrl(path).data.publicUrl}
function login(){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md"><h2>Login Admin</h2><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><p id="er" style="color:#c0392b;font-size:13px;margin:4px 0;min-height:18px"></p><button class="btn" id="go">Masuk</button> <button class="btn o" id="cx">Batal</button></div>`;document.body.appendChild(o);
const go=async()=>{const {error}=await sb.auth.signInWithPassword({email:o.querySelector('#em').value.trim(),password:o.querySelector('#pw').value});if(error)o.querySelector('#er').textContent=/invalid/i.test(error.message)?'Email atau password salah':error.message;else location.reload()};

document.addEventListener('click',async e=>{
const t=e.target,d=t.dataset||{};
try{
if(t.closest&&t.closest('#th')){theme(document.documentElement.dataset.theme==='dark'?'light':'dark');render()}
else if(d.up){const k=d.up;pick(k==='photo'?800:1200,async b=>{msg='Mengunggah…';render();try{setP(k,await upl(b,'jpg','image/jpeg'));dirty=true;msg=''}catch(er){msg='Gagal upload: '+er.message}render()})}
